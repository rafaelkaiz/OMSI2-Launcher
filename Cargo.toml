[package]
name = "omsi2-launcher"
version = "0.9.0-beta.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rafaelkaiz/OMSI2-Launcher"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"
