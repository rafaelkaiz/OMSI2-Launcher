[package]
name = "omsi2-launcher-plugin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Optional OMSI 2 plugin: lets the launcher press the start button of OMSI's start screen from inside the game."

[lib]
name = "OMSI2LauncherPlugin"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
